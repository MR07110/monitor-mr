<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>MONITOR SHELL</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="apple-touch-icon" href="./favicon.svg">
  <link rel="stylesheet" href="./style.css?v=4.0">
  <link rel="stylesheet" href="./xterm.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="./xterm.js"></script>
  <script src="./xterm-addon-fit.js"></script>
</head>
<body>

  <!-- 0. SPLASH SCREEN -->
  <div id="splash-view" class="view">
    <div class="splash-container">
      <div class="splash-logo-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="app-logo splash-logo">
          <circle cx="50" cy="50" r="50" fill="black" />
          <g fill="white">
            <polyline points="28 42 42 50 28 58" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <line x1="48" y1="58" x2="68" y2="58" stroke="#00ff66" stroke-width="6" stroke-linecap="round" />
          </g>
        </svg>
      </div>
      <h1 class="splash-title">MONITOR SHELL</h1>
      <div class="splash-loader">
        <div class="splash-bar"></div>
      </div>
    </div>
  </div>

  <!-- 1. LOGIN VIEW -->
  <div id="login-view" class="view hidden">
    <div class="login-container">
      <div class="logo-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="app-logo">
          <circle cx="50" cy="50" r="50" fill="black" />
          <g fill="none">
            <polyline points="28 42 42 50 28 58" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="48" y1="58" x2="68" y2="58" stroke="#00ff66" stroke-width="6" stroke-linecap="round" />
          </g>
        </svg>
      </div>

      <div class="card">
        <div class="header">
          <h1>MONITOR SHELL</h1>
          <p>Xavfsiz masofaviy terminal</p>
        </div>

        <form id="login-form">
          <div id="login-error" class="error-msg hidden"></div>

          <div class="field">
            <input type="text" id="username" placeholder="Foydalanuvchi" required autocomplete="username" autocapitalize="none" autocorrect="off">
          </div>

          <div class="field">
            <input type="password" id="password" placeholder="Parol" required autocomplete="current-password">
          </div>

          <button type="submit" id="submit-btn" class="btn">Kirish</button>
        </form>
      </div>
    </div>
  </div>

  <!-- 2. PTY TERMINAL (1:1 XTERM INTERACTIVE SHELL) -->
  <div id="pty-view" class="view hidden">
    <!-- PTY HEADER BAR -->
    <div class="pty-header-bar">
      <div class="pty-header-left">
        <span class="pty-title">🐚 SHELL</span>
        <span id="pty-status-badge" class="pty-badge connecting">Ulanmoqda...</span>
        <span id="pty-net-badge" class="pty-badge local">Aniqlanmoqda...</span>
      </div>
      <div class="pty-header-right">
        <a id="pty-lan-switch-btn" class="pty-action-btn lan-btn hidden" href="#" title="Lokal Wi-Fi ga to‘g‘ridan-to‘g‘ri o‘tish (0ms)">⚡ Lokal Wi-Fi</a>
        <button id="pty-reconnect-btn" class="pty-action-btn" type="button" title="Qayta ulanish">🔄</button>
        <button id="pty-fullscreen-btn" class="pty-action-btn" type="button" title="To‘liq ekran">⛶</button>
        <button id="pty-logout-btn" class="pty-action-btn danger" type="button" title="Chiqish">Chiqish</button>
      </div>
    </div>

    <!-- PTY XTERM CONTAINER -->
    <div id="pty-terminal-wrapper" class="pty-terminal-wrapper">
      <div id="pty-terminal-container" class="pty-terminal-container"></div>
    </div>

    <!-- MOBIL YORDAMCHI TUGMALAR (ESC, TAB, CTRL, ARROWS, SUDO) -->
    <div id="pty-virtual-keys" class="pty-virtual-keys">
      <button type="button" class="pty-key-btn" data-code="esc">ESC</button>
      <button type="button" class="pty-key-btn" data-code="tab">TAB</button>
      <button type="button" class="pty-key-btn" data-code="ctrl_c">CTRL+C</button>
      <button type="button" class="pty-key-btn" data-code="ctrl_d">CTRL+D</button>
      <button type="button" class="pty-key-btn" data-code="up">▲</button>
      <button type="button" class="pty-key-btn" data-code="down">▼</button>
      <button type="button" class="pty-key-btn" data-code="left">◀</button>
      <button type="button" class="pty-key-btn" data-code="right">▶</button>
      <button type="button" class="pty-key-btn" data-code="sudo">sudo</button>
      <button type="button" class="pty-key-btn" data-code="enter">ENTER</button>
    </div>
  </div>

  <script src="./app.js?v=4.0"></script>
</body>
</html>
